[3,"การใช้หลักลูกหนี้ร่วมจะนำมาใช้ในกรณีใด",["กรณีที่เจ้าหน้าที่ต้องชำระค่าสินไหมทดแทนให้หน่วยงานของรัฐ อันเกิดจากความผิดเฉพาะตัวของเจ้าหน้าที่ต่อหน่วยงานรัฐ","กรณีที่เจ้าหน้าที่ต้องชำระค่าสินไหมทดแทนให้หน่วยงานภายนอก แล้วพบภายหลังว่าเจ้าหน้าที่ปฏิบัติหน้าที่ด้วยความประมาทเลินเล่ออย่างร้ายแรง","กรณีที่หน่วยงานของรัฐต้องชำระค่าสินไหมทดแทนให้เจ้าหน้าที่ อันเกิดจากความประมาทเลินเล่ออย่างร้ายแรง","กรณีที่หน่วยงานของรัฐต้องชำระค่าสินไหมทดแทนให้เจ้าหน้าที่ ที่ไม่ใช่การปฏิบัติหน้าที่"],0],
[3,"หากท่านได้รับความเสียหายจากเจ้าหน้าที่รัฐที่กระทำผิดจากการปฏิบัติหน้าที่ต่อท่านตามพระราชบัญญัติความรับผิดทางละเมิดของเจ้าหน้าที่ ท่านควรดำเนินการอย่างไร",["ฟ้องร้องเรียกค่าเสียหายจากเจ้าหน้าที่รัฐ","ฟ้องร้องเรียกค่าเสียหายจากหน่วยงานราชการที่เจ้าหน้าที่สังกัด","แจ้งความร้องทุกข์กับตำรวจ","การดำเนินการทั้ง 3 อย่างได้ทั้งหมด"],1],
[3,"ครูตุลย์เป็นข้าราชการครูวิทยฐานะชำนาญการพิเศษ เข้าร่วมชุมนุมประท้วงอย่างสงบและปราศจากอาวุธเพื่อขอให้แก้ไขรัฐธรรมนูญ เจ้าหน้าที่ตำรวจมาสลายการชุมนุมโดยใช้กำลังเกินกว่าเหตุ ใช้กระสุนจริงยิง ครูตุลย์ได้รับบาดเจ็บสาหัส ครูตุลย์สามารถฟ้องเรียกร้องค่าสินไหมทดแทนได้หรือไม่",["ฟ้องไม่ได้ เพราะครูตุลย์เป็นข้าราชการไม่มีสิทธิเข้าร่วมการชุมนุมประท้วงเพื่อขอให้มีการแก้ไขรัฐธรรมนูญ","ฟ้องไม่ได้ เพราะเจ้าหน้าที่ตำรวจมาสลายการชุมนุมประท้วงตามหน้าที่ทั่วไป","ฟ้องได้ เพราะเจ้าหน้าที่ตำรวจได้ใช้กำลังเกินกว่าเหตุ","ฟ้องได้ เพราะการเข้าร่วมการประท้วงกับชาวบ้านอย่างสงบและปราศจากอาวุธเป็นสิทธิของปวงชนชาวไทยที่กำหนดไว้ในรัฐธรรมนูญ"],2],
[3,"หากครูในโรงเรียนรัฐกระทำการละเมิดสิทธิของนักเรียนระหว่างอยู่ในโรงเรียน เช่น ทำร้ายร่างกาย ลงโทษด้วยวิธีการรุนแรง พระราชบัญญัติความรับผิดทางละเมิดของเจ้าหน้าที่มีบทบาทอย่างไรในการจัดการสถานการณ์นี้",["ครูจะไม่ได้รับการลงโทษทางละเมิดใดๆ เพราะเป็นการกระทำที่เกิดขึ้นระหว่างการปฏิบัติหน้าที่","สามารถลงโทษทางวินัยแก่ครูได้ แต่ไม่สามารถลงโทษทางละเมิดใดๆ ได้","นักเรียนสามารถฟ้องร้องโรงเรียนหรือฟ้องครูเพื่อเรียกร้องค่าเสียหายได้","นักเรียนสามารถแจ้งผู้อำนวยการโรงเรียนหรือครูท่านอื่น รวมทั้งเจ้าหน้าที่ทางปกครอง เพื่อให้มีการกล่าวหาและกล่าวโทษครูได้"],2],
[4,"ความผิดในข้อใดมีโอกาสที่จะได้รับโทษทางอาญาเบาที่สุด",["ป้องกันหรือขัดขวางมิให้มีการปฏิบัติตามกฎหมายหรือคำสั่ง","ปลอมแปลงเอกสารทางราชการ","รับรองหลักฐานเอกสารทางราชการอันเป็นเท็จ","จ่ายทรัพย์เกินกว่าที่ควรจ่ายเพื่อประโยชน์สำหรับตนเองและผู้อื่น"],0],
[4,"ความผิดในข้อใดมีโอกาสที่จะได้รับโทษทางอาญาสูงสุด",["เรียก รับ หรือยอมจะรับทรัพย์สินหรือประโยชน์อื่นใดสำหรับตนเองหรือผู้อื่นโดยมิชอบ เพื่อกระทำการหรือไม่กระทำการอย่างใดในตำแหน่งไม่ว่าการนั้นจะชอบหรือมิชอบด้วยหน้าที่","ปฏิบัติหรือละเว้นการปฏิบัติหน้าที่โดยมิชอบ เพื่อให้เกิดความเสียหายแก่ผู้หนึ่งผู้ใด หรือปฏิบัติหรือละเว้นการปฏิบัติหน้าที่โดยทุจริต","มีหน้าที่ดูแลรักษาทรัพย์หรือเอกสาร กระทำการอันมิชอบด้วยหน้าที่ โดยถอน ทำให้เสียหาย ทำลาย หรือทำให้ไร้ประโยชน์ ซึ่งตราหรือเครื่องหมายที่เจ้าพนักงานได้ประทับไว้","รู้หรืออาจรู้ความลับในราชการ กระทำโดยประการใดอันมิชอบด้วยหน้าที่ให้ผู้อื่นล่วงรู้ความลับนั้น"],0],
[4,"การกระทำในข้อใดต่อไปนี้ไม่เป็นความผิดฐานเจ้าพนักงานใช้อำนาจในตำแหน่งโดยมิชอบตามประมวลกฎหมายอาญา มาตรา 148",["ปลัดอำเภอมีหน้าที่เกี่ยวกับการเงินตามโครงการ กสช. ได้สั่งให้คณะกรรมการสภาตำบลแก้ไขหลักฐานการเบิกจ่ายเงินให้เกินความเป็นจริง แล้วเอาเงินนั้นไว้เป็นประโยชน์ส่วนตนโดยทุจริต","เจ้าพนักงานพัฒนาชุมชนอำเภอจูงใจเรียกเงินจากราษฎรที่มาประชุมโครงการจัดสร้างฝายน้ำล้น เพื่อให้สมาชิกสภาผู้แทนราษฎรนำไปขอรับเงินจัดสรรจากรัฐบาล เมื่อราษฎรจ่ายเงินแล้วเก็บเงินนั้นเป็นส่วนตัว","รัฐมนตรีช่วยว่าการกระทรวงมหาดไทยกดดันสั่งให้เจ้าพนักงานที่ดินออกโฉนดให้แก่ตนเองในนามบริษัท และโยกย้ายลดขั้นเงินเดือนผู้ที่ไม่ให้ความร่วมมือ เมื่อเจ้าพนักงานที่ดินลงนามออกโฉนดให้แล้ว ได้มอบพระเครื่องผงสุวรรณเลี่ยมทองคำคนละ 1 องค์","นายเอกเป็นหัวหน้าหน่วยป้องกันรักษาป่า มีอำนาจจับกุมผู้กระทำผิดกฎหมายป่าไม้ ได้เข้าตรวจค้นและยึดไม้จากร้านค้าไม้ของนายแดง กล่าวหาว่ามีไม้เกินปริมาณ แต่นายแดงแจ้งว่าได้รับอนุญาตแล้ว ซึ่งนายเอกเข้าตรวจค้นและยึดไม้เพราะนายแดงไม่จ่ายเงินให้ตามที่เรียกร้อง"],0],
[4,"การที่สำนักงานคณะกรรมการการศึกษาขั้นพื้นฐานห้ามมิให้ข้าราชการในสังกัดทำหนังสือและจัดการติวสอบครูผู้ช่วยในสังกัด สพฐ. เกี่ยวข้องกับประมวลกฎหมายอาญา ในส่วนความผิดต่อตำแหน่งหน้าที่ราชการมาตราใด",["มาตรา 147","มาตรา 152","มาตรา 161","มาตรา 166"],1],
[4,"ข้อใดคือความผิดมาตรา 157 ประมวลกฎหมายอาญา พ.ศ. 2499 ในส่วนความผิดต่อตำแหน่งหน้าที่ราชการ",["ทำให้เสียหาย ทำลาย ซ่อนเร้น เอาไปเสีย หรือทำให้สูญหายหรือไร้ประโยชน์ ซึ่งทรัพย์หรือเอกสารอันเป็นหน้าที่ของตนที่จะปกครองหรือรักษาไว้ หรือยินยอมให้ผู้อื่นกระทำเช่นนั้น","มีหน้าที่ซื้อ ทำ จัดการหรือรักษาทรัพย์ใด เบียดบังทรัพย์นั้นเป็นของตน หรือเป็นของผู้อื่นโดยทุจริต หรือโดยทุจริตยอมให้ผู้อื่นเอาทรัพย์นั้นเสีย","มีหน้าที่ปฏิบัติการให้เป็นไปตามกฎหมายหรือคำสั่ง ป้องกันหรือขัดขวางมิให้การเป็นไปตามกฎหมายหรือคำสั่งนั้น","ปฏิบัติหรือละเว้นการปฏิบัติหน้าที่โดยมิชอบ เพื่อให้เกิดความเสียหายแก่ผู้หนึ่งผู้ใด หรือปฏิบัติหรือละเว้นการปฏิบัติหน้าที่โดยทุจริต"],3],
[4,"ใช้อำนาจในตำแหน่งโดยมิชอบ ข่มขืนใจหรือจูงใจเพื่อให้บุคคลใดมอบให้หรือหามาให้ซึ่งทรัพย์สินหรือประโยชน์อื่นใดแก่ตนเองหรือผู้อื่น ต้องระวางโทษตามข้อใด",["จำคุกไม่เกิน 5 ปี หรือปรับไม่เกิน 100,000 บาท หรือทั้งจำทั้งปรับ","จำคุกตั้งแต่ 5 - 10 ปี หรือปรับไม่เกิน 400,000 บาท หรือทั้งจำทั้งปรับ","จำคุกตั้งแต่ 5 - 20 ปี และปรับตั้งแต่ 100,000 - 400,000 บาท หรือทั้งจำทั้งปรับ","จำคุกตั้งแต่ 5 - 20 ปี และปรับตั้งแต่ 100,000 - 400,000 บาท หรือประหารชีวิต"],3],
[4,"เจ้าพนักงานผู้ใดมีหน้าที่หรือแสดงว่าตนมีหน้าที่เรียกเก็บหรือตรวจสอบภาษีอากร ค่าธรรมเนียม หรือเงินอื่นใด โดยทุจริตเรียกเก็บหรือละเว้นไม่เรียกเก็บ หรือกระทำการหรือไม่กระทำการอย่างใด เพื่อให้ผู้มีหน้าที่เสียภาษีอากรหรือค่าธรรมเนียมมิต้องเสียหรือเสียน้อยไปกว่าที่ต้องเสีย ต้องระวางโทษตามข้อใด",["จำคุกตั้งแต่ 5 - 10 ปี และปรับตั้งแต่ 100,000 - 400,000 บาท หรือจำคุกตลอดชีวิต","จำคุกตั้งแต่ 5 - 20 ปี และปรับตั้งแต่ 100,000 - 400,000 บาท หรือจำคุกตลอดชีวิต","จำคุกตั้งแต่ 5 - 40 ปี และปรับตั้งแต่ 100,000 - 400,000 บาท หรือจำคุกตลอดชีวิต","จำคุกตั้งแต่ 5 - 10 ปี และปรับตั้งแต่ 100,000 - 400,000 บาท หรือประหารชีวิต"],1],
[4,"เจ้าพนักงานผู้ใดละทิ้งงานหรือกระทำการอย่างใด ๆ เพื่อให้งานหยุดชะงักหรือเสียหาย โดยร่วมกระทำการเช่นนั้นด้วยกันตั้งแต่ 5 คนขึ้นไป ต้องระวางโทษตามข้อใด",["จำคุกไม่เกิน 5 ปี หรือปรับไม่เกิน 100,000 บาท หรือทั้งจำทั้งปรับ","จำคุกไม่เกิน 10 ปี หรือปรับไม่เกิน 200,000 บาท หรือทั้งจำทั้งปรับ","จำคุกตั้งแต่ 5 - 20 ปี และปรับตั้งแต่ 100,000 - 200,000 บาท หรือทั้งจำทั้งปรับ","จำคุกตั้งแต่ 5 - 40 ปี และปรับตั้งแต่ 100,000 - 400,000 บาท หรือทั้งจำทั้งปรับ"],0],
[4,"ข้อใดต่อไปนี้เป็นความผิดโดยทุจริต",["เรียกเก็บหรือละเว้นไม่เรียกเก็บภาษีอากรหรือค่าธรรมเนียม","รู้หรืออาจรู้ความลับในราชการ แล้วเปิดเผยความลับนั้น","ข่มขืนใจหรือจูงใจเพื่อให้บุคคลใดมอบหรือหามาให้ซึ่งทรัพย์สินหรือประโยชน์อื่นใดแก่ตนเองหรือผู้อื่น","หน้าที่จัดการหรือดูแลกิจการใด เข้ามีส่วนได้เสียเพื่อประโยชน์สำหรับตนเองหรือผู้อื่น"],0],
[4,"เจ้าพนักงานผู้ใดละทิ้งงานหรือกระทำการอย่างใด ๆ เพื่อให้งานหยุดชะงักหรือเสียหาย โดยร่วมกระทำการเช่นนั้นด้วยกันตั้งแต่ 5 คนขึ้นไป แล้วไปกระทำผิดในกรณีใดอาจได้รับโทษเพิ่มเป็น 2 เท่า",["กระทำลงไปเพื่อจะเปลี่ยนแปลงกฎหมายแผ่นดิน","กระทำลงไปเพื่อบังคับรัฐบาล","กระทำลงไปเพื่อข่มขู่ประชาชน","ถูกทุกข้อ"],3],
[4,"การกระทำผิดทางวาจาในข้อใด เป็นความผิดต่อตำแหน่งหน้าที่ราชการตามประมวลกฎหมายอาญา",["ดุด่าว่ากล่าวนักเรียน","รายงานเท็จต่อผู้บังคับบัญชา","เปิดเผยความลับของสถานศึกษา","กล่าวถ้อยคำดูถูกเหยียดหยามเพื่อนร่วมงาน"],2],
[4,"ข้าราชการครูทำผิดอาญาข้อใดแล้วถูกสั่งลงโทษไล่ออกจากราชการได้",["ครูดำ ขโมยทรัพย์สินของโรงเรียนไปจำนำ ถูกศาลพิพากษาให้ชำระค่าปรับให้ผู้เสียหาย","ครูแดง ขับรถของโรงเรียนไปอบรมต่างจังหวัดในขณะที่เมาสุรา ถูกศาลพิพากษาให้จำคุก","ครูขาว ปลอมแปลงเอกสารศึกษา ถูกศาลพิพากษาให้ชำระค่าปรับ 100,000 บาท","ครูเขียว เรียกรับเงินแป๊ะเจี๊ยะฝากบุตรหลานเข้าโรงเรียน ถูกศาลพิพากษาถึงที่สุดให้จำคุกตลอดชีวิต"],3],
[4,"ข้าราชการที่มีหน้าที่รับผิดชอบการตรวจสอบการก่อสร้างของภาครัฐไม่ปฏิบัติตามหน้าที่และปล่อยให้การก่อสร้างไม่เป็นไปตามมาตรฐาน จนเกิดอุบัติเหตุหรือความเสียหาย การกระทำนี้สามารถเป็นความผิดตามประมวลกฎหมายอาญาหรือไม่",["เป็นความผิดในข้อหาละเว้นการปฏิบัติหน้าที่","ไม่เป็นความผิด เพราะเป็นความรับผิดชอบของผู้รับเหมางาน","เป็นความผิดในข้อหาทุจริตต่อหน้าที่ราชการ","ไม่เป็นความผิด เพราะเป็นแค่ความผิดพลาดในการทำงาน"],0],
[4,"ครูปาณัสมีหน้าที่รับผิดชอบในการดำเนินการประมูลจัดซื้อจัดจ้างของโรงเรียน ได้เลือกผู้ชนะการประกวดราคาจัดซื้อจัดจ้างให้ส่วนลดเป็นเงินสดให้กับครูปาณัสเป็นการส่วนตัว การกระทำของครูปาณัสถือเป็นความผิดตามประมวลกฎหมายอาญาในเรื่องใด",["ความผิดฐานปฏิบัติหน้าที่โดยมิชอบ","ความผิดฐานใช้อำนาจหน้าที่โดยมิชอบ","ความผิดฐานรับสินบน","เป็นความผิดทุกข้อรวมกัน"],3],
[4,"ครูดวงดาว ลงโทษนักเรียนที่ทำผิดระเบียบโรงเรียนอย่างรุนแรงเกินกว่าเหตุ และไม่มีการรายงานเหตุการณ์ดังกล่าวให้ผู้บริหารทราบ การกระทำของครูดวงดาวเข้าข่ายความผิดทางอาญาฐานใด",["การปฏิบัติหน้าที่โดยมิชอบ","ใช้อำนาจหน้าที่มิชอบ","ไม่ปฏิบัติตามคำสั่งผู้บังคับบัญชา","ไม่มีความผิดทางอาญา แต่ผิดวินัย"],0],
[5,"ข้อใดไม่จริงเกี่ยวกับพระราชบัญญัติมาตรฐานทางจริยธรรม",["มีที่มาจากรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560 มาตรา 76","ให้มีมาตรฐานทางจริยธรรม เพื่อให้หน่วยงานของรัฐใช้เป็นหลักในการกำหนดประมวลจริยธรรมสำหรับเจ้าหน้าที่ของรัฐในหน่วยงานนั้น ๆ ซึ่งต้องไม่ต่ำกว่ามาตรฐานทางจริยธรรมที่กำหนดตามพระราชบัญญัตินี้","มาตรฐานทางจริยธรรมเป็นหลักเกณฑ์การจัดทำประมวลจริยธรรม กระบวนการรักษาจริยธรรมของเจ้าหน้าที่ของรัฐ รวมทั้งมาตรการและกลไกที่มีประสิทธิภาพเพื่อเสริมสร้างให้มีการปฏิบัติตามประมวลจริยธรรม","เกี่ยวกับสภาพคุณงามความดีที่เจ้าหน้าที่ของรัฐต้องยึดถือสำหรับการปฏิบัติงาน การตัดสินความถูกผิดทั้งทางจรรยาบรรณ วินัย และจริยธรรม เพื่อเสริมสร้างให้เจ้าหน้าที่ของรัฐมีมาตรฐานทางจริยธรรม"],3],
[5,"มาตรฐานทางจริยธรรม มีความหมายตรงกับข้อใดมากที่สุด",["เป็นหลักเกณฑ์การประพฤติปฏิบัติอย่างมีคุณธรรมของเจ้าหน้าที่ของรัฐ","เป็นข้อกำหนดเพื่อให้หน่วยงานของรัฐใช้เป็นหลักในการกำหนดประมวลจริยธรรมสำหรับเจ้าหน้าที่ของรัฐในหน่วยงานนั้น ๆ","เป็นแบบแผนเกี่ยวกับการปฏิบัติหน้าที่สำหรับเจ้าหน้าที่","เป็นมาตรฐานขั้นต่ำเพื่อให้หน่วยงานของรัฐใช้เป็นหลักในการกำหนดประมวลจริยธรรมสำหรับเจ้าหน้าที่ของรัฐในหน่วยงานนั้น ๆ"],0],

[5,"ข้อใดไม่ใช่มาตรฐานทางจริยธรรมซึ่งใช้เป็นหลักสำคัญในการจัดทำประมวลจริยธรรมของหน่วยงานของรัฐที่จะกำหนดเป็นหลักเกณฑ์ในการปฏิบัติตนของเจ้าหน้าที่ของรัฐ",["ซื่อสัตย์สุจริต มีจิตสำนึกที่ดี และรับผิดชอบต่อหน้าที่","กล้าตัดสินใจและกระทำในสิ่งที่ถูกต้องชอบธรรม","คิดถึงประโยชน์ส่วนรวมมากกว่าประโยชน์ส่วนตัว และมีจิตสาธารณะ","มุ่งผลสัมฤทธิ์ต่อภารกิจของรัฐ"],3],
[5,"ข้อใดแสดงถึงการมีจิตสำนึกที่ดีและมีความรับผิดชอบต่อหน้าที่",["เมื่อเกิดความผิดพลาดขึ้นจากการปฏิบัติหน้าที่ วิวัฒน์รีบแก้ไขให้ถูกต้องและชี้แจงให้ผู้เกี่ยวข้องทราบ","วิศาล นำตัวอย่างผลงานวิจัยในชั้นเรียนของตนไปให้เพื่อนครูศึกษาเพื่อนำไปเป็นแบบอย่างในการทำวิจัย","เมื่อผู้บังคับบัญชาร้องขออาสาสมัคร วิภา รีบแสดงตนเพื่อเป็นตัวแทนโรงเรียนไปทำหน้าที่ช่วยเหลืองานของจังหวัด","วิลาสินี หลีกเลี่ยงที่จะพูดคุยกับนักเรียนและเพื่อนครูเกี่ยวกับการชุมนุมทางการเมือง เนื่องจากไม่ต้องการให้เกิดความขัดแย้ง"],0],
[5,"พฤติกรรม การมีส่วนร่วมในกิจกรรมของหน่วยงานหรือกิจกรรมของชุมชนเพื่อสร้างชุมชนให้เข้มแข็ง เป็นพฤติกรรมที่แสดงให้เห็นตามหลักเกณฑ์การประพฤติปฏิบัติอย่างมีคุณธรรมสำหรับเจ้าหน้าที่ของรัฐข้อใด",["คิดถึงประโยชน์ส่วนรวมมากกว่าประโยชน์ส่วนตัว และมีจิตสาธารณะ","ดำรงตนเป็นแบบอย่างที่ดีและรักษาภาพลักษณ์ของราชการ","ปฏิบัติหน้าที่อย่างเป็นธรรมและไม่เลือกปฏิบัติ","มุ่งผลสัมฤทธิ์ของงาน"],0],
[5,"ข้อใดมีหน้าที่จัดทำประมวลจริยธรรมสำหรับเจ้าหน้าที่ของรัฐที่อยู่ในความรับผิดชอบ",["คณะรัฐมนตรี","องค์กรกลางบริหารงานบุคคล","คณะกรรมการข้าราชการพลเรือน","คณะกรรมการข้าราชการครูและบุคลากรทางการศึกษา"],1],

[5,"ข้อกล่าวถึงการรักษาจริยธรรมของเจ้าหน้าที่ของรัฐ ได้ไม่ถูกต้อง",["กำหนดให้มีผู้รับผิดชอบเกี่ยวกับการรักษาจริยธรรมประจำหน่วยงานของรัฐ","ดำเนินกิจกรรมการส่งเสริม สนับสนุน ให้ความรู้ อบรม และพัฒนาเจ้าหน้าที่ของรัฐในหน่วยงานของรัฐ","กำหนดบทลงโทษสำหรับผู้ที่ฝ่าฝืนมาตรฐานทางจริยธรรม","ทุกสิ้นปีงบประมาณ ให้จัดทำรายงานประจำปีตามหลักเกณฑ์ที่ ก.ม.จ. กำหนด"],2],
[5,"พระราชบัญญัติมาตรฐานทางจริยธรรม พ.ศ. 2562 ได้กำหนดให้ใครเป็นผู้ตรวจสอบรายงานประจำปีของหน่วยงานของรัฐ เพื่อรายงานสรุปผลคณะรัฐมนตรีให้ทราบอย่างน้อยปีละหนึ่งครั้ง",["คณะกรรมการธรรมาภิบาล","องค์กรกลางบริหารงานบุคคล","คณะกรรมการพิทักษ์ระบบคุณธรรม","คณะกรรมการมาตรฐานทางจริยธรรม"],3],
[5,"ข้อใดต่อไปนี้มีหน้าที่กำกับดูแลการดำเนินกระบวนการรักษาจริยธรรม และการประเมินผลการปฏิบัติตามประมวลจริยธรรมของเจ้าหน้าที่",["คณะรัฐมนตรี","องค์กรกลางบริหารงานบุคคล","คณะกรรมการข้าราชการพลเรือน","คณะกรรมการข้าราชการครูและบุคลากรทางการศึกษา"],1],
[5,"ข้อใดต่อไปนี้มีหน้าที่กำกับดูแลการดำเนินกระบวนการรักษาจริยธรรม และการประเมินผลการปฏิบัติตามประมวลจริยธรรมของข้าราชการครูและบุคลากรทางการศึกษา",["คณะรัฐมนตรี","องค์กรกลางบริหารงานบุคคล","คณะกรรมการข้าราชการพลเรือน","คณะกรรมการข้าราชการครูและบุคลากรทางการศึกษา"],3],
[5,"ข้อใดไม่ใช่ประมวลจริยธรรมข้าราชการครูและบุคลากรทางการศึกษา ตามที่คณะกรรมการข้าราชการครูและบุคลากรทางการศึกษามีมติเห็นชอบ",["ซื่อสัตย์สุจริต มีจิตสำนึกที่ดี และรับผิดชอบต่อหน้าที่ฐานะข้าราชการครูและบุคลากรทางการศึกษา","เคารพในศักดิ์ศรีความเป็นมนุษย์ คำนึงถึงสิทธิเด็ก และยอมรับความแตกต่างของบุคคล","มีความรักและเทิดทูนชาติ ศาสนา พระมหากษัตริย์","ยึดถือและปฏิบัติตามจรรยาบรรณของวิชาชีพ"],3],
[5,"การมีความรับผิดชอบและยอมรับต่อผลการกระทำของตนเอง อธิบายสิ่งที่ปฏิบัติได้อย่างมีเหตุผลและชอบธรรม เพื่อรักษาประโยชน์ของทางราชการและประโยชน์ส่วนรวมเป็นสำคัญ เป็นแนวทางการประพฤติปฏิบัติตนตามประมวลจริยธรรมข้าราชการครูและบุคลากรทางการศึกษาในข้อใด",["ซื่อสัตย์สุจริต มีจิตสำนึกที่ดี มีความรับผิดชอบต่อหน้าที่และต่อผู้เกี่ยวข้องในฐานะข้าราชการครูและบุคลากรทางการศึกษา","มุ่งผลสัมฤทธิ์ของงาน มุ่งมั่นในการปฏิบัติงานอย่างเต็มกำลังความสามารถ ที่สะท้อนถึงคุณภาพผู้เรียนและคุณภาพการศึกษา","ปฏิบัติหน้าที่อย่างเป็นธรรมและไม่เลือกปฏิบัติ","กล้าคิด กล้าตัดสินใจ กล้าแสดงออก และกระทำในสิ่งที่ถูกต้องชอบธรรม"],3],
[5,"การปฏิบัติต่อผู้เรียน ผู้รับบริการ และผู้ที่เกี่ยวข้องอย่างเสมอภาคไม่เลือกปฏิบัติ โดยอาศัยเหตุของความแตกต่างในเรื่องเชื้อชาติ ศาสนา เพศ อายุ สภาพร่างกาย สถานะทางเศรษฐกิจสังคม และความเชื่อทางการเมือง เป็นแนวทางการประพฤติปฏิบัติตนตามประมวลจริยธรรมข้าราชการครูและบุคลากรทางการศึกษาในข้อใด",["ปฏิบัติหน้าที่อย่างเป็นธรรมและไม่เลือกปฏิบัติ","ซื่อสัตย์สุจริต มีจิตสำนึกที่ดี มีความรับผิดชอบต่อหน้าที่และต่อผู้เกี่ยวข้องในฐานะข้าราชการครูและบุคลากรทางการศึกษา","มุ่งผลสัมฤทธิ์ของงาน มุ่งมั่นในการปฏิบัติงานอย่างเต็มกำลังความสามารถ ที่สะท้อนถึงคุณภาพผู้เรียนและคุณภาพการศึกษา","กล้าคิด กล้าตัดสินใจ กล้าแสดงออก และกระทำในสิ่งที่ถูกต้องชอบธรรม"],0],
[5,"ครูสุมารับฟังความคิดเห็น พร้อมที่จะชี้แจง หรืออธิบายเหตุผลให้แก่ผู้เรียน ผู้รับบริการร่วมงานหรือผู้เกี่ยวข้องทราบ การกระทำของครูสุมาสอดคล้องกับประมวลจริยธรรมข้าราชการครูและบุคลากรทางการศึกษาในข้อใด",["ซื่อสัตย์สุจริต มีจิตสำนึกที่ดี มีความรับผิดชอบต่อหน้าที่และต่อผู้เกี่ยวข้องในฐานะข้าราชการครูและบุคลากรทางการศึกษา","กล้าคิด กล้าตัดสินใจ กล้าแสดงออก และกระทำในสิ่งที่ถูกต้องชอบธรรม","มุ่งผลสัมฤทธิ์ของงาน มุ่งมั่นในการปฏิบัติงานอย่างเต็มกำลังความสามารถ ที่สะท้อนถึงคุณภาพผู้เรียนและคุณภาพการศึกษา","เคารพในศักดิ์ศรีความเป็นมนุษย์ คำนึงถึงสิทธิเด็ก และยอมรับความแตกต่างของบุคคล"],2],

[5,"ข้อใดกล่าวถึงข้าราชการไทยในยุค 4.0 ได้ไม่ถูกต้อง",["ต้องก้าวออกจากกรอบความคิดและวิธีการทำงานแบบเดิม พร้อมท้าทายสิ่งใหม่ แก้ไขปัญหาอย่างมีเหตุผล","ต้องสามารถประสานการทำงานร่วมกัน เพื่อไปสู่เป้าหมายเดียวกันทั้งภายในหน่วยงานเดียวกัน ระหว่างหน่วยงานของรัฐ ระหว่างหน่วยงานของรัฐกับเอกชน และระหว่างหน่วยงานรัฐกับประชาชน","ต้องมีปัญญาสร้างสรรค์ โดยร่วมกันสร้างสรรค์ผลงานที่เป็นเลิศและใช้ประโยชน์จากเทคโนโลยีดิจิทัล เพื่อสร้างความประทับใจและการมีส่วนร่วมจากประชาชน","ต้องเป็นผู้มีความรักชาติ ศาสนา พระมหากษัตริย์ และยึดมั่นในหลักการปกครองแบบประชาธิปไตยอันมีพระมหากษัตริย์ทรงเป็นพระประมุข"],3],

[2,"ข้อใดต่อไปนี้กล่าวถึงพระราชบัญญัติวิธีปฏิบัติราชการทางปกครอง ได้ไม่เป็นจริง",["ฉบับที่ 1 พ.ศ. 2534 มีผลบังคับใช้เมื่อพ้น 180 วันนับแต่วันประกาศในราชกิจจานุเบกษา และกำหนดหลักเกณฑ์และขั้นตอนต่าง ๆ สำหรับการดำเนินงานทางปกครอง","ฉบับที่ 2 แก้ไข พ.ศ. 2557 เพื่ออำนวยความเป็นธรรมแก่ประชาชน และเป็นการป้องกันการทุจริตและประพฤติมิชอบในวงราชการ","ฉบับที่ 3 แก้ไข พ.ศ. 2562 เนื่องจากบทบัญญัติเกี่ยวกับการบังคับทางปกครองยังไม่มีประสิทธิภาพ โดยเฉพาะการบังคับตามคำสั่งทางปกครองที่กำหนดให้ชำระเงิน","วิธีปฏิบัติราชการทางปกครองตามกฎหมายต่าง ๆ ให้เป็นไปตามที่กำหนดในพระราชบัญญัตินี้เท่านั้น แต่มิให้ใช้บังคับกับขั้นตอนและระยะเวลาอุทธรณ์หรือโต้แย้งที่กำหนดในกฎหมาย"],3],
[2,"ข้อใดกล่าวถึงสาระสำคัญของวิธีปฏิบัติราชการทางปกครองตามที่กำหนดในพระราชบัญญัตินี้ได้ไม่ถูกต้อง",["พระราชบัญญัตินี้เป็นหลักเกณฑ์ที่ประกันความเป็นธรรมหรือมีมาตรฐานในการปฏิบัติราชการไม่ต่ำกว่าหลักเกณฑ์ที่กำหนดในพระราชบัญญัตินี้","ในกรณีที่กฎหมายใดกำหนดวิธีปฏิบัติราชการทางปกครองเรื่องใดไว้โดยเฉพาะให้ใช้ตามกฎหมายนั้น","การยกเว้นไม่นำพระราชบัญญัตินี้ไปใช้กับหน่วยงานใดให้ตราเป็นพระราชกฤษฎีกาตามข้อเสนอของคณะกรรมการที่มีอำนาจดำเนินการพิจารณาทางปกครอง","ให้คณะกรรมการวิธีปฏิบัติราชการทางปกครองจัดทำรายงานเสนอคณะรัฐมนตรีอย่างน้อยปีละหนึ่งครั้ง เพื่อพัฒนาและปรับปรุงการปฏิบัติราชการทางปกครอง"],2],

[0,"ข้อใดไม่ถูกต้องเกี่ยวกับการปฏิบัติราชการแทน",["การมอบอำนาจต้องทำเป็นหนังสือ","ผู้มอบอำนาจยังปฏิบัติหน้าที่ในตำแหน่ง","เมื่อผู้มอบอำนาจได้มอบอำนาจแล้ว ผู้รับมอบอำนาจต้องปฏิบัติตามหน้าที่นั้น","เมื่อผู้มอบอำนาจได้มอบอำนาจให้ผู้รับมอบแล้ว ผู้มอบอำนาจมีสิทธิในการแก้ไขการปฏิบัติราชการนั้น"],1],
[0,"ในกรณีที่รายจ่ายต่อหน่วยของงานบริการสาธารณะของส่วนราชการใดสูงกว่า รายจ่ายต่อหน่วยของงานบริการสาธารณะประเภทและคุณภาพเดียวกันของส่วนราชการอื่น ให้ดำเนินการอย่างไร",["ให้ส่วนราชการนั้นเสนอกรมบัญชีกลาง สำนักงบประมาณ และก.พ.ร. เพื่อทำแผนการลดรายจ่ายต่อหน่วยของงานบริการสาธารณะ","ให้ส่วนราชการนั้นจัดทำแผนการลดรายจ่ายต่อหน่วยของงานบริการสาธารณะเสนอกรมบัญชีกลาง","ให้กรมบัญชีกลาง สำนักงบประมาณ และคณะกรรมการพัฒนาระบบราชการเป็นผู้พิจารณาว่าสมควรให้ดำเนินงานบริการสาธารณะดังกล่าวต่อหรือไม่","เสนอแผนรายจ่ายต่อหน่วยของงานบริการสาธารณะของส่วนราชการดังกล่าวให้คณะรัฐมนตรีพิจารณาอนุมัติ"],0],
[0,"ถ้าส่วนราชการที่มีอำนาจอนุญาต อนุมัติ หรือให้ความเห็นชอบไม่สามารถดำเนินการให้แล้วเสร็จในเวลาที่กำหนด หากเกิดความเสียหายขึ้น ให้ถือว่าอย่างไร",["ข้าราชการซึ่งมีหน้าที่เกี่ยวข้องและหัวหน้าส่วนราชการนั้นประมาทเลินเล่ออย่างร้ายแรง","ข้าราชการซึ่งมีหน้าที่เกี่ยวข้องและหัวหน้าส่วนราชการนั้นประมาทเลินเล่อไม่ร้ายแรง","ข้าราชการซึ่งมีหน้าที่เกี่ยวข้องประมาทเลินเล่อร้ายแรง และหัวหน้าส่วนราชการนั้นประมาทเลินเล่อไม่ร้ายแรง","ข้าราชการซึ่งมีหน้าที่เกี่ยวข้องประมาทเลินเล่อไม่ร้ายแรง และหัวหน้าส่วนราชการนั้นประมาทเลินเล่อร้ายแรง"],0],
[0,"ส่วนราชการมีหน้าที่สำรวจ ตรวจสอบ และทบทวนกฎหมาย กฎ ระเบียบ ข้อบังคับและประกาศ เพื่อยกเลิก ปรับปรุง หรือจัดให้มีกฎหมายใหม่ โดยใช้หลักเกณฑ์อะไร",["ความสอดคล้องกับแผนพัฒนาเศรษฐกิจและสังคมแห่งชาติ และเงินงบประมาณ","เงินงบประมาณ และสถานการณ์ทางเศรษฐกิจ","ความสะดวกรวดเร็ว และลดภาระของประชาชนเป็นสำคัญ","วินัยทางการคลัง"],2],
[0,"กรณีมีกฎหมายข้าราชการพลเรือนที่กำหนดว่าเจ้าหน้าที่ต้องแจ้งข้อมูลข้อเท็จจริงเกี่ยวกับการขออนุญาตทางราชการให้คู่กรณีก่อนแล้ว แต่ใน พ.ร.บ.วิธีปฏิบัติราชการทางปกครอง พ.ศ. 2539 มิได้กำหนดไว้ ให้ทำอย่างไร",["ยึดตามกฎหมายข้าราชการพลเรือนที่กำหนดเพราะมีความเป็นธรรมมากกว่า","ยึดตามกฎหมายข้าราชการพลเรือนที่กำหนดเพราะมีการกำหนดไว้เป็นการเฉพาะ","ยึดตามพระราชบัญญัติวิธีปฏิบัติราชการทางปกครอง เพราะเป็นบทบัญญัติที่เกิดขึ้นภายหลัง","ยึดตามพระราชบัญญัติวิธีปฏิบัติราชการทางปกครอง เพราะเป็นกฎหมายที่กำหนดมาตรฐาน"],1],
[0,"ข้อใดคือความหมายของ วิธีปฏิบัติราชการทางปกครอง",["การเตรียมการและการดำเนินการของเจ้าหน้าที่ เพื่อจัดให้มีคำสั่งทางปกครอง","การเตรียมการและการดำเนินการของเจ้าหน้าที่ เพื่อจัดให้มีคำสั่งทางปกครองหรือกฎ","การเตรียมการเพื่อใช้อำนาจตามกฎหมายของเจ้าหน้าที่ เพื่อออกกฎระเบียบหรือข้อบังคับ","การเตรียมการเพื่อกำหนดนโยบายโดยคณะบุคคลสำหรับการวินิจฉัยชี้ขาดสิทธิและหน้าที่ตามกฎหมาย"],1],
[0,"คณะรัฐมนตรี มีหน้าที่ใดในคณะกรรมการวิธีปฏิบัติราชการทางปกครอง",["รับรายงานจากคณะกรรมการวิธีปฏิบัติราชการทางปกครอง","เรียกให้เจ้าหน้าที่หรือบุคคลอื่นใดมาชี้แจงหรือแสดงความเห็นประกอบการพิจารณา","ให้คำปรึกษาแก่เจ้าหน้าที่เกี่ยวกับการปฏิบัติตาม พ.ร.บ.วิธีปฏิบัติราชการทางปกครอง","สอดส่องดูแลและให้คำแนะนำเกี่ยวกับการดำเนินงานของเจ้าหน้าที่ในการปฏิบัติตาม พ.ร.บ.วิธีปฏิบัติราชการทางปกครอง"],0],
[0,"ข้อใดเป็นคำสั่งทางปกครอง",["คำสั่งลงโทษทางวินัย","คำสั่งแต่งตั้งคณะกรรมการสอบสวนวินัย","คำสั่งแต่งตั้งคณะกรรมการพิจารณาทางปกครอง","ถูกทุกข้อ"],0],
[0,"กรณีที่นายอำเภอออกหนังสือเตือนให้นาย ก ออกจากที่ดิน เนื่องจากบุกรุกที่ดินของราชการภายใน 30 วัน โดยแจ้งว่าหากไม่ดำเนินการจะบังคับใช้ประมวลกฎหมายอาญา ถือเป็นคำสั่งทางปกครองหรือไม่",["เป็น เพราะเป็นคำสั่งของเจ้าหน้าที่ทางปกครอง","เป็น เพราะหนังสือดังกล่าวเกี่ยวข้องกับ นาย ก โดยตรง","ไม่เป็น เพราะเป็นหนังสือเตือนไม่ได้มีการบังคับทางปกครองให้ออกจากที่ดิน","ไม่เป็น เพราะนายอำเภอมีอำนาจหน้าที่เกี่ยวข้องกับเรื่องที่ดิน"],2],
[0,"นาง A เป็นครูสอนวิทยาศาสตร์ ก่อนทำการสอนไม่ได้ตรวจสอบสภาพสายไฟที่เสื่อมชำรุด ทำให้เกิดไฟฟ้าช็อตนักเรียน ผู้ปกครองจะฟ้องร้องใคร และศาลใด",["ฟ้องครู ที่ศาลปกครอง","ฟ้องครู ที่ศาลยุติธรรม","ฟ้องโรงเรียน ที่ศาลยุติธรรม","ฟ้องโรงเรียน ที่ศาลปกครอง"],2],
[0,"ในคดีที่ผู้เสียหายฟ้องหน่วยงานของรัฐ หน่วยงานของรัฐมีสิทธิขอให้ศาลเรียกเจ้าหน้าที่เข้ามาเป็นคู่ความในคดีได้เมื่อใด",["หน่วยงานของรัฐเห็นว่าเจ้าหน้าที่ต้องรับผิดหรือต้องร่วมรับผิด","เจ้าหน้าที่เห็นว่าหน่วยงานรัฐต้องรับผิดหรือต้องร่วมรับผิด","หน่วยงานของรัฐสามารถขอให้ศาลเรียกเจ้าหน้าที่เข้ามาเป็นคู่ความในคดีได้ตลอด แม้จะไม่ต้องรับผิดหรือร่วมรับผิดก็ตาม","เจ้าหน้าที่สามารถขอให้ศาลเรียกหน่วยงานของรัฐเข้ามาเป็นคู่ความในคดีได้ตลอด แม้จะไม่ต้องรับผิดหรือร่วมรับผิดก็ตาม"],0],
[0,"กรณีเจ้าหน้าที่ของรัฐกระทำละเมิดต่อหน่วยงานต้นสังกัดของตน โดยพิจารณาแล้วว่ามีการกระทำอันจงใจและประมาทเลินเล่ออย่างร้ายแรง ซึ่งผิดวินัยด้วย จะดำเนินการอย่างไร",["ตั้งกรรมการสอบสวนความรับผิดทางละเมิด ก่อนตั้งคณะกรรมการสอบสวนทางวินัย","ตั้งกรรมการสอบสวนความรับผิดทางละเมิด พร้อมกับตั้งคณะกรรมการสอบสวนทางวินัย","ตั้งกรรมการสอบสวนความรับผิดทางละเมิด หลังตั้งคณะกรรมการสอบสวนทางวินัย","ตั้งคณะกรรมการสอบสวนทางวินัย ตามความเห็นของผู้บังคับบัญชา"],1],
[0,"ครูมานะได้รับคำสั่งให้พานักเรียนไปแข่งฟุตบอล โดย ผอ.โรงเรียนได้แต่งตั้งลุงชัยให้ขับรถพาไป ระหว่างเดินทางเกิดรถชนกับเสาไฟฟ้า การไฟฟ้าจะฟ้องใคร",["ฟ้องครูมานะ","ฟ้องลุงชัย","ฟ้องครูมานะ ลุงชัย และผอ.โรงเรียน","ฟ้องโรงเรียน"],3],
[0,"นาย ก ได้รับการแต่งตั้งเป็นคณะกรรมการออกข้อสอบเพื่อบรรจุข้าราชการของสหกรณ์ออมทรัพย์ครู แล้วเรียกรับเงินจากนาย ข เพื่อให้ได้บรรจุทำงาน นาย ก ผิดประมวลกฎหมายอาญาข้อใด",["จูงใจให้ได้มาซึ่งทรัพย์สิน","เรียกรับสินบน","ปฏิบัติหน้าที่โดยมิชอบ","มีส่วนได้เสียกับกิจการ"],1],
[0,"ข้อใดไม่เป็นความผิดเกี่ยวกับเจ้าพนักงานมีหน้าที่ซื้อ ทำ จัดการหรือรักษาทรัพย์ ทำการเบียดบังทรัพย์ไปเป็นของตนเอง หรือยอมให้ผู้อื่นเอาทรัพย์นั้นไปโดยทุจริต",["ตำรวจรับเงินจากญาติที่เอามามอบให้เป็นค่าจัดการงานศพ แล้วเบียดบังเงินนั้นไปเพื่อประโยชน์ส่วนตน","เจ้าหน้าที่ทำเรื่องเบิกเงินให้กับผู้รับเหมา ทั้ง ๆ ที่งานยังไม่เสร็จตามสัญญา แล้วนำเงินนั้นไปใช้เอง","เจ้าหน้าที่ที่มีหน้าที่เก็บค่าธรรมเนียมจากการขอเอกสารทางราชการ แต่เก็บเงินเกินแล้วเอาส่วนที่เกินไปใช้เอง","เจ้าหน้าที่การเงินได้รับคำสั่งให้เป็นกรรมการรับเงิน แต่ไปรับเงินจากบริษัทเพื่อนำไปใช้ในประโยชน์ส่วนตน"],2],
[0,"ส่งรายชื่อครูดีเด่นผิดพลาด โดยขาดไป 1 คน เมื่อได้ทำการตรวจสอบอีกครั้งพบความผิดพลาดดังกล่าว โดยไม่รอช้า ดำเนินการติดต่อประสานงานกับคณะทำงาน จัดเตรียมโล่รางวัลเพิ่มเติม ตรงกับจริยธรรมข้อใด",["กล้าตัดสินใจ และกระทำในสิ่งที่ถูกต้องชอบธรรม","ซื่อสัตย์สุจริต มีจิตสำนึกที่ดี และรับผิดชอบต่อหน้าที่","มุ่งผลสัมฤทธิ์ของงาน","ปฏิบัติหน้าที่อย่างเป็นธรรมและไม่เลือกปฏิบัติ"],1],
[2,"หากเจ้าหน้าที่ผู้ทำคำสั่งทางปกครองได้รับอุทธรณ์ของคู่กรณีแล้ว เห็นด้วยกับคำอุทธรณ์ไม่ว่าทั้งหมดหรือบางส่วนจะต้องดำเนินการอย่างไรต่อไป",["ให้ผู้มีอำนาจพิจารณาคำอุทธรณ์พิจารณาให้แล้วเสร็จภายใน 30 วัน นับแต่วันที่ตนได้รับรายงาน","ให้เร่งรายงานความเห็นพร้อมเหตุผลไปยังผู้มีอำนาจพิจารณาอุทธรณ์ภายใน 30 วัน นับแต่วันที่ได้รับอุทธรณ์","ให้ดำเนินการเปลี่ยนแปลงคำสั่งทางปกครองตามความเห็นของตนภายในกำหนดเวลา 30 วัน นับแต่วันที่ได้รับอุทธรณ์","ถ้ามีเหตุจำเป็นไม่อาจพิจารณาให้แล้วเสร็จภายในระยะเวลา ให้ผู้มีอำนาจพิจารณาอุทธรณ์ขยายเวลาพิจารณาอุทธรณ์ออกไปได้ไม่เกิน 30 วัน"],2],
[2,"ในกรณีใดต่อไปนี้ที่คู่กรณีอาจขอให้เจ้าหน้าที่พิจารณาใหม่ได้ภายใน 90 วัน นับแต่ผู้นั้นได้รู้ถึงเหตุซึ่งอาจขอให้พิจารณาใหม่ได้",["คู่กรณีที่แท้จริงไม่ได้เข้ามาในกระบวนการพิจารณาทางปกครอง หรือได้เข้ามาแล้วแต่ถูกตัดโอกาสโดยไม่เป็นธรรมในการมีส่วนร่วมในกระบวนการ","การพิจารณาทางปกครองโดยเจ้าหน้าที่ที่มีอำนาจที่จะทำคำสั่งทางปกครองในเรื่องนั้น","ถ้าคำสั่งทางปกครองได้มีข้อกฎหมายที่เปลี่ยนแปลงไปในสาระสำคัญในทางที่จะเป็นประโยชน์แก่เจ้าหน้าที่","ถูกทุกข้อ"],0],
[2,"การแต่งตั้งกรรมการผู้ทรงคุณวุฒิ ในคณะกรรมการที่มีอำนาจดำเนินการในการพิจารณาทางปกครอง ให้ดำเนินการตามข้อใด",["ให้คณะรัฐมนตรีแต่งตั้งโดยต้องไม่เป็นผู้ดำรงตำแหน่งทางการเมือง","ให้คณะกรรมการวิธีปฏิบัติราชการทางปกครองแต่งตั้ง","ให้คณะกรรมการวิธีปฏิบัติราชการทางปกครองแต่งตั้งโดยระบุตัวบุคคล","ให้แต่งตั้งโดยระบุตัวบุคคล"],3],
[2,"หากท่านเป็นครูโชติช่วงถูกคำสั่งลงโทษวินัยร้ายแรง ให้ไล่ออกจากราชการ ท่านคิดว่าท่านไม่ผิดเพราะหลักฐานที่มีจากกล้องวงจรปิดถูกตัดต่อ ท่านคิดว่าควรทำเช่นไร",["ขอให้คณะกรรมการสอบสวนวินัยร้ายแรง พิจารณาใหม่เพราะหลักฐานที่มีจากกล้องวงจรปิดถูกตัดต่อ","ยื่นอุทธรณ์คำสั่งลงโทษทางวินัยร้ายแรง โดยเป็นหนังสือโดยระบุข้อโต้แย้งและข้อเท็จจริงหรือข้อกฎหมายที่อ้างอิงประกอบ","ขอให้เจ้าหน้าที่ที่พิจารณาใหม่ภายใน 90 วัน พร้อมแสดงหลักฐานจากกล้องวงจรปิดใหม่","ยื่นฟ้องคดีต่อศาลปกครอง"],1],
[1,"ข้อใดไม่ใช่เป้าหมายของการบริหารบ้านเมืองที่ดี",["การบริหารราชการเพื่อประโยชน์สุขของประชาชน อำนวยความสะดวกให้ประชาชน และไม่มีขั้นตอนการปฏิบัติงานเกินความจำเป็น","การมีประสิทธิภาพและเกิดความคุ้มค่าในเชิงภารกิจของรัฐและไม่มีขั้นตอนการปฏิบัติงานเกินความจำเป็น","มีการปรับปรุงภารกิจของส่วนราชการให้ทันต่อสถานการณ์ และประชาชนได้รับการอำนวยความสะดวก และได้รับการตอบสนองความต้องการ","มีการประเมินผลการปฏิบัติราชการอย่างสม่ำเสมอ และบริหารราชการเพื่อผลสัมฤทธิ์ต่อภารกิจของงาน"],3],
[1,"เป้าหมายการบริหารกิจการบ้านเมืองที่ดี ข้อใดเกี่ยวข้องกับการปฏิบัติหน้าที่ทางราชการมากที่สุด",["การบริหารราชการเพื่อประโยชน์สุขของประชาชน","ผลสัมฤทธิ์ต่อภารกิจของภาครัฐ","การลดขั้นตอนและไม่มีขั้นตอนการปฏิบัติงานเกินความจำเป็น","การมีประสิทธิภาพและเกิดความคุ้มค่าในเชิงภารกิจของรัฐ"],2],
[1,"การบริหารราชการเพื่อประโยชน์สุขของประชาชน ข้อใดไม่เป็นจริง",["เกิดความผาสุก ความเป็นอยู่ที่ดีของประชาชน","ความสงบและความปลอดภัยของสังคม","ประชาชนมั่งคั่ง กินดีอยู่ดี","ประโยชน์สูงสุดของประเทศ"],2],
[1,"การจัดทำแผนปฏิบัติราชการ ต้องจัดทำให้สอดคล้องกับเรื่องต่าง ๆ ต่อไปนี้ ข้อใดไม่เป็นจริง",["ยุทธศาสตร์ชาติ แผนแม่บท","แผนการปฏิรูปประเทศ","แผนพัฒนาเศรษฐกิจและสังคมแห่งชาติ","นโยบายของคณะรัฐมนตรี และแผนบริหารราชการแผ่นดิน"],3],
[1,"เพราะเหตุใดส่วนราชการจึงมีหน้าที่พัฒนาความรู้ในส่วนราชการ เพื่อให้มีลักษณะเป็นองค์การแห่งการเรียนรู้อย่างสม่ำเสมอ",["เพื่อประโยชน์สุขของประชาชน","เพื่อเกิดผลสัมฤทธิ์ต่อภารกิจของภาครัฐ","เพื่อประสิทธิภาพและความคุ้มค่าในเชิงภารกิจของรัฐ","เพื่อให้มีการประเมินผลการปฏิบัติราชการอย่างสม่ำเสมอ"],1],
[1,"ข้อใดต่อไปนี้มีหน้าที่ประเมินความคุ้มค่าในการปฏิบัติภารกิจของรัฐที่ส่วนราชการดำเนินการอยู่",["ก.พ.ร. และสำนักงบประมาณ","ก.พ.ร. สำนักงบประมาณ และกรมบัญชีกลาง","สำนักงานคณะกรรมการพัฒนาการเศรษฐกิจและสังคมแห่งชาติ และสำนักงบประมาณ","ก.พ.ร. สำนักงานคณะกรรมการพัฒนาการเศรษฐกิจและสังคมแห่งชาติ และสำนักงบประมาณ"],2],
[1,"สำนักงานพัฒนารัฐบาลดิจิทัลมีฐานะตามข้อใด",["เป็นนิติบุคคลในกำกับกระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม","เป็นหน่วยงานในกำกับดูแลของสำนักนายกรัฐมนตรี","เป็นองค์การมหาชน สังกัดสำนักนายกรัฐมนตรี","เป็นองค์การมหาชน สังกัดกระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม"],2],
[1,"ข้อใดไม่เป็นสิ่งที่ต้องพิจารณาเมื่อส่วนราชการต้องทบทวนความจำเป็น หรือสมควรยกเลิก ปรับปรุงภารกิจในปัจจุบัน",["แผนปฏิบัติราชการ","ยุทธศาสตร์ชาติ แผนแม่บท","แผนการปฏิรูปประเทศ แผนพัฒนาฯ นโยบายของคณะรัฐมนตรีที่แถลงต่อรัฐสภา","เงินงบประมาณ ความคุ้มค่า สถานการณ์อื่น"],0],
[1,"ข้อใดต้องจัดให้มีระบบเครือข่ายสารสนเทศของส่วนราชการเพื่ออำนวยความสะดวกให้แก่ประชาชนที่จะสามารถติดต่อสอบถาม หรือขอข้อมูล หรือแสดงความคิดเห็นเกี่ยวกับการปฏิบัติราชการของส่วนราชการ",["กระทรวงดิจิทัลเพื่อเศรษฐกิจและสังคม","กระทรวงวิทยาศาสตร์และเทคโนโลยี","สำนักงานพัฒนารัฐบาลดิจิทัล","ส่วนราชการ"],3],
[1,"ส่วนราชการต้องไม่เปิดเผยข้อมูลเกี่ยวกับเรื่องใดได้",["รายการจัดซื้อและจัดจ้าง","งบประมาณรายจ่ายแต่ละปี และสัญญาใดที่ได้มีการอนุมัติให้จัดซื้อหรือจัดจ้างแล้ว","ข้อเสนอแนะและข้อร้องเรียน","ถูกทั้ง 1) และ 2)"],2],
[1,"ข้อใดไม่เป็นจริงเกี่ยวกับการประเมินผลการปฏิบัติราชการ",["การประเมินส่วนราชการต้องประเมินโดยคณะผู้ประเมินอิสระ","การประเมินผู้บังคับบัญชาประเมินโดยต้องกระทำโดยเปิดเผย","การประเมินข้าราชการประเมินโดยดูจากผลการปฏิบัติงานเฉพาะตัว ประโยชน์และผลสัมฤทธิ์ที่หน่วยงานได้รับ","ถูกทุกข้อ"],1],
[1,"ข้อใดต่อไปนี้มีหน้าที่ดูแลช่วยเหลือองค์กรปกครองส่วนท้องถิ่นต้องจัดทำหลักเกณฑ์การบริหารกิจการบ้านเมืองที่ดีตามแนวทางพระราชกฤษฎีกานี้",["คณะรัฐมนตรี","คณะกรรมการพัฒนาระบบราชการ","กระทรวงมหาดไทย","กรมส่งเสริมการปกครองท้องถิ่น"],2],
[1,"ข้อใดต่อไปนี้ไม่ต้องจัดทำแผนปฏิบัติราชการประจำปีให้สอดคล้องกับแผนปฏิบัติราชการของกระทรวงศึกษาธิการ",["สำนักงานรับรองมาตรฐานและประเมินคุณภาพการศึกษา","สำนักงานคณะกรรมการข้าราชการครูและบุคลากรทางการศึกษา","สำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน","กรมส่งเสริมการเรียนรู้"],0],
[1,"ท่านคิดว่านโยบาย “ครูและบุคลากรทางการศึกษาคืนถิ่น” โดยการนำระบบ TRS มาใช้กับการย้ายข้าราชการครู สอดคล้องกับเป้าหมายการบริหารกิจการบ้านเมืองที่ดีข้อใดมากที่สุด",["การบริหารราชการเพื่อประโยชน์สุขของประชาชน","การบริหารราชการเพื่อผลสัมฤทธิ์ต่อภารกิจของภาครัฐ","การบริหารราชการอย่างมีประสิทธิภาพและเกิดความคุ้มค่าในเชิงภารกิจของรัฐ","การลดขั้นตอนการปฏิบัติงานและไม่มีขั้นตอนการปฏิบัติงานเกินความจำเป็น"],3],
[1,"หลักธรรมาภิบาลของการบริหารกิจการบ้านเมืองที่ดีข้อใดสอดคล้องกับแนวคิดการบริหารจัดการภาครัฐแนวใหม่",["การปฏิบัติราชการต้องสามารถตอบคำถามและชี้แจงได้เมื่อมีข้อสงสัย","การปฏิบัติราชการต้องรับฟังความเห็นของประชาชน และเปิดโอกาสให้ประชาชนมีส่วนร่วม","การปฏิบัติราชการต้องใช้ทรัพยากรอย่างคุ้มค่า ลดขั้นตอน และระยะเวลาในการปฏิบัติงาน","การปฏิบัติราชการต้องมีจิตสำนึก ความรับผิดชอบในการปฏิบัติหน้าที่"],2],
[1,"ข้อใดไม่เป็นจริงเกี่ยวกับสาระสำคัญของพระราชกฤษฎีกาว่าด้วยหลักเกณฑ์และวิธีการบริหารกิจการบ้านเมืองที่ดี ในปัจจุบัน",["การยกเลิกแผนบริหารราชการแผ่นดินและแผนนิติบัญญัติ","การจัดทำแผนปฏิบัติราชการต้องจัดทำให้สอดคล้องกับยุทธศาสตร์ชาติ 20 ปี แผนแม่บท แผนการปฏิรูปประเทศ แผนพัฒนาเศรษฐกิจและสังคมแห่งชาติ นโยบายของคณะรัฐมนตรีที่แถลงต่อรัฐสภา","การจัดทำแผนปฏิบัติราชการเป็นระยะเวลา 5 ปี","ส่วนราชการต้องเป็นองค์กรแห่งการเรียนรู้โดยยกระดับภาครัฐโดยใช้แพลตฟอร์มดิจิทัลกลาง"],3],
[1,"ข้อใดต่อไปนี้ไม่ใช่เป้าหมายหลักของการแก้ไขเพิ่มเติมหลักเกณฑ์เกี่ยวกับวิธีการบริหารกิจการบ้านเมืองที่ดี (ฉบับที่ 2) พ.ศ. 2562",["การจัดทำแผนปฏิบัติราชการ ให้สอดคล้องกับยุทธศาสตร์ชาติ แผนแม่บท แผนการปฏิรูปประเทศ แผนพัฒนาเศรษฐกิจและสังคมแห่งชาติ นโยบายของคณะรัฐมนตรีที่แถลงต่อรัฐสภา","การปรับโครงสร้างส่วนราชการ ในกรณีที่มีการยุบเลิก โอน หรือรวมส่วนราชการใดทั้งหมดหรือบางส่วน ห้ามมิให้จัดตั้งส่วนราชการที่มีภารกิจหรืออำนาจหน้าที่ที่มีลักษณะเดียวกันหรือคล้ายคลึงกันกับส่วนราชการดังกล่าวขึ้นอีก เว้นแต่มีเหตุผลและความจำเป็นเพื่อรักษาความมั่นคงของรัฐหรือเศรษฐกิจของประเทศ หรือรักษาประโยชน์ส่วนรวมของประชาชน และโดยได้รับความเห็นชอบจาก ค.ร.ม.","การบริการประชาชนและการติดต่อประสานงานระหว่างส่วนราชการด้วยกันโดยผ่านแพลตฟอร์มดิจิทัลกลาง","ให้ส่วนราชการจัดให้มีการทบทวนภารกิจของตนว่าภารกิจใดมีความจำเป็น หรือสมควรที่จะยกเลิก ปรับปรุง หรือเปลี่ยนแปลงการดำเนินการต่อไปหรือไม่ โดยคำนึงถึงชาติแผนแม่บท แผนการปฏิรูปประเทศ แผนพัฒนาเศรษฐกิจและสังคมแห่งชาติ นโยบายของคณะรัฐมนตรีที่แถลงต่อรัฐสภา และแผนอื่นที่เกี่ยวข้อง รวมถึงกำลังเงินงบประมาณของประเทศ ความคุ้มค่าของภารกิจและสถานการณ์อื่นประกอบกัน"],1],
[1,"ข้อใดไม่ใช่สิ่งที่ส่วนราชการต้องทำก่อนเริ่มดำเนินการเพื่อประโยชน์สูงสุดของประชาชน",["กำหนดขั้นตอนการดำเนินการที่โปร่งใส","ศึกษาวิเคราะห์ผลดีผลเสียให้ครบถ้วนทุกด้าน","ชี้แจงทำความเข้าใจเพื่อให้ประชาชนได้ตระหนักถึงประโยชน์ที่ส่วนรวมจะได้รับ","รับฟังความคิดเห็นและความพึงพอใจของประชาชน"],3],
[1,"การบริหารราชการเพื่อให้เกิดผลสัมฤทธิ์ต่อภารกิจของรัฐ ให้ส่วนราชการปฏิบัติดังต่อไปนี้ ยกเว้นข้อใด",["ก่อนจะดำเนินการตามภารกิจใด ส่วนราชการต้องจัดทำแผนปฏิบัติราชการไว้เป็นการล่วงหน้า","การกำหนดแผนปฏิบัติราชการของส่วนราชการต้องมีขั้นตอน ระยะเวลาและงบประมาณที่จะต้องใช้ในการดำเนินการของแต่ละขั้นตอน เป้าหมายของภารกิจ ผลสัมฤทธิ์ของภารกิจ และตัวชี้วัดความสำเร็จของภารกิจ","ส่วนราชการต้องจัดให้มีการติดตามและประเมินผลการปฏิบัติตามแผนปฏิบัติราชการ ตามหลักเกณฑ์และวิธีการที่ส่วนราชการกำหนดขึ้น ซึ่งต้องสอดคล้องกับมาตรฐานที่ ค.ร.ม. กำหนด","ในกรณีที่การปฏิบัติภารกิจ หรือการปฏิบัติตามแผนปฏิบัติราชการเกิดผลกระทบต่อประชาชน ให้เป็นหน้าที่ของส่วนราชการที่จะต้องดำเนินการแก้ไขหรือบรรเทาผลกระทบนั้น หรือเปลี่ยนแผนปฏิบัติราชการให้เหมาะสม"],2],
[1,"การจัดซื้อจัดจ้างโดยทั่วไปให้ส่วนราชการดำเนินการอย่างไร",["ให้คำนึงถึงคุณภาพและการดูแลรักษา","จะต้องเปิดเผยและเที่ยงธรรม","ต้องถือราคาต่ำสุดในการเสนอซื้อหรือจ้าง","ให้คำนึงถึงประสิทธิภาพและความคุ้มค่า"],1],
[1,"พระราชกฤษฎีกาว่าด้วยหลักเกณฑ์และวิธีการบริหารกิจการบ้านเมืองที่ดี (ฉบับที่ 2) ไม่ได้แก้ไขในเป้าหมายใด",["การบริหารราชการเพื่อผลสัมฤทธิ์ต่อภารกิจของรัฐ","การบริหารราชการเพื่อประสิทธิภาพและเกิดความคุ้มค่าในเชิงภารกิจของรัฐ","การลดขั้นตอนและไม่มีขั้นตอนการปฏิบัติงานเกินความจำเป็น","การปรับปรุงภารกิจของส่วนราชการให้ทันต่อสถานการณ์"],1],
[1,"ในกรณีใดต่อไปนี้ ก.พ.ร. สามารถเสนอคณะรัฐมนตรีจัดสรรเงินเพิ่มพิเศษเป็นบำเหน็จความชอบแก่ส่วนราชการ หรือให้ส่วนราชการใช้เงินงบประมาณเหลือจ่าย เพื่อนำไปใช้ปรับปรุงการปฏิบัติงานหรือจัดสรรเป็นรางวัลให้ข้าราชการในสังกัด",["เมื่อส่วนราชการใดสามารถปฏิบัติหน้าที่และภารกิจ ได้ตอบสนองต่อนโยบายที่ฝ่ายบริหารกำหนดได้อย่างมีประสิทธิภาพและคุ้มค่า","เมื่อส่วนราชการใดดำเนินการให้บริการมีคุณภาพและเป็นไปตามเป้าหมายที่กำหนด รวมทั้งเป็นที่พึงพอใจแก่ประชาชน","เมื่อส่วนราชการดำเนินงานบรรลุเป้าหมาย สามารถเพิ่มผลงานและผลสัมฤทธิ์ โดยไม่เป็นการเพิ่มค่าใช้จ่ายและคุ้มค่าต่อภารกิจของรัฐ หรือลดค่าใช้จ่าย","ถูกทั้งข้อ 2) และ 3)"],3],
[1,"องค์กรปกครองส่วนท้องถิ่นต้องจัดทำหลักเกณฑ์การบริหารกิจการบ้านเมืองที่ดีตามแนวทางพระราชกฤษฎีกาว่าด้วยหลักเกณฑ์และวิธีการบริหารกิจการบ้านเมืองที่ดี อย่างน้อยในเรื่องใดบ้าง",["การบริหารราชการเพื่อประโยชน์สุขของประชาชน และเพื่อผลสัมฤทธิ์ต่อภารกิจของรัฐ","การลดขั้นตอนการปฏิบัติงาน และการอำนวยความสะดวกและตอบสนองความต้องการของประชาชน","การปฏิบัติราชการเพื่อให้เกิดประสิทธิภาพและความคุ้มค่า และมีการประเมินผลการปฏิบัติราชการอย่างสม่ำเสมอ","การปรับปรุงภารกิจของส่วนราชการทันให้ตามสถานการณ์ และประชาชนได้รับการอำนวยความสะดวกและตอบสนองความต้องการของประชาชน"],1],
[1,"ในการปฏิบัติราชการต้องรับฟังความคิดเห็นของประชาชน รวมทั้งเปิดให้ประชาชนมีส่วนร่วมในการรับรู้ ทำความเข้าใจ ร่วมแสดงทัศนะ ร่วมเสนอปัญหา โดยการมีส่วนร่วม การพยายามแสวงหาฉันทามติ ข้อความดังกล่าวสอดคล้องกับแนวคิดหลักธรรมาภิบาลของการบริหารกิจการบ้านเมืองที่ดีข้อใด",["การบริหารจัดการภาครัฐแนวใหม่","ค่านิยมประชาธิปไตย","ประชารัฐ","ความรับผิดชอบทางการบริหาร"],2],
[1,"ครูคนใดไม่มีค่านิยมประชาธิปไตย ตามหลักธรรมาภิบาลของการบริหารกิจการบ้านเมืองที่ดี",["ครูปิติสอนลูกศิษย์ทุกคนโดยเท่าเทียมกันไม่มีเลือกปฏิบัติต่อผู้เรียน","ครูปนิดาใช้อำนาจตามกฎระเบียบของโรงเรียนอย่างเคร่งครัด และปฏิบัติหน้าที่ด้วยความซื่อสัตย์สุจริต","ครูปรีชญากระจายความรับผิดชอบในการดำเนินงานให้แก่ครูอัตราจ้างและพนักงานราชการได้ทำงานอย่างเหมาะสม","ครูปรีดาตอบข้อสงสัยของผู้ปกครองเมื่อผู้ปกครองสงสัยเกี่ยวกับการจัดกิจกรรมการเรียนเพิ่มเติมนอกห้องเรียนของโรงเรียนได้"],2],

<div class="q3"><button class="go" onclick="go(ids(()=>1),20)"><b>20</b><span>สุ่มเร็ว</span></button><button class="go" onclick="go(ids(()=>1),40)"><b>40</b><span>สุ่มกลาง</span></button><button class="go" onclick="go(ids(()=>1),60)"><b>60</b><span>สุ่มเต็ม</span></button></div>
<button class="long" onclick="go(ids(k=>!M.has(k)),30)" ${wr?'':'disabled'}><span class="ic" style="background:#ff6b4a22">🎲</span><span><b>เจาะข้อที่ยังไม่เคยถูก</b><br><span class="m">เหลือ ${wr} ข้อ</span></span></button>
<button class="long" onclick="go([...BK])" ${BK.size?'':'disabled'}><span class="ic" style="background:#d99a0022">⭐</span><span><b>ทบทวนข้อที่บันทึกไว้</b><br><span class="m">${BK.size} ข้อ</span></span></button>
<h2>เลือกทีละฉบับ</h2>`+S.map((s,k)=>k<G?row(k):'').join('')+`<h2>📚 วิชาภาษาไทย <span class="m">· ${H-G} หัวข้อ</span></h2><div class="q3" style="grid-template-columns:repeat(2,1fr)"><button class="go" onclick="go(ids(j=>Q[j][0]>=G),30)"><b>30</b><span>สุ่มภาษาไทย</span></button><button class="go" onclick="go(ids(j=>Q[j][0]>=G),60)"><b>60</b><span>สุ่มภาษาไทย</span></button></div><div class="m" style="margin:8px 2px 4px">ภาษาไทยทั้งหมด ${ids(j=>Q[j][0]>=G).length} ข้อ · ถูกแล้ว ${ids(j=>Q[j][0]>=G&&M.has(j)).length} ข้อ</div>`+S.map((s,k)=>k>=G&&k<H?row(k):'').join('')+`<h2>📝 ชุดข้อสอบวิชาภาษาไทย <span class="m">· ${X-H} ชุด</span></h2><div class="q3" style="grid-template-columns:repeat(2,1fr)"><button class="go" onclick="go(ids(j=>Q[j][0]>=H&&Q[j][0]<X),30)"><b>30</b><span>สุ่มจากชุด 1–5</span></button><button class="go" onclick="go(ids(j=>Q[j][0]>=H&&Q[j][0]<X),60)"><b>60</b><span>สุ่มจากชุด 1–5</span></button></div><div class="m" style="margin:8px 2px 4px">${ids(j=>Q[j][0]>=H&&Q[j][0]<X).length} ข้อ · ถูกแล้ว ${ids(j=>Q[j][0]>=H&&Q[j][0]<X&&M.has(j)).length} ข้อ</div>`+S.map((s,k)=>k>=H&&k<X?row(k):'').join('')+(S.length>X?`<h2>➕ ข้อสอบเพิ่มเติม <span class="m">· ${S.length-X} ชุด</span></h2><div class="q3" style="grid-template-columns:repeat(2,1fr)"><button class="go" onclick="go(ids(j=>Q[j][0]>=X),30)"><b>30</b><span>สุ่มจากชุดเพิ่ม</span></button><button class="go" onclick="go(ids(j=>Q[j][0]>=X),60)"><b>60</b><span>สุ่มจากชุดเพิ่ม</span></button></div><div class="m" style="margin:8px 2px 4px">${ids(j=>Q[j][0]>=X).length} ข้อ · ถูกแล้ว ${ids(j=>Q[j][0]>=X&&M.has(j)).length} ข้อ</div>`+S.map((s,k)=>k>=X?row(k):'').join(''):'')}
function setMode(m){mode=m;sv('ktmode',mode);home();tst(m=='now'?'⚡ เปลี่ยนเป็นเฉลยทันที':'📝 เปลี่ยนเป็นเฉลยท้ายชุด')}
function go(a,n){if(!a.length){tst('ไม่มีข้อให้ทำในตัวเลือกนี้','info');return}qs=sh(a).slice(0,n||999);an=[];i=0;pal=0;t0=Date.now();stop();tm=setInterval(()=>{const e=document.getElementById('tm');if(e)e.textContent=mmss(Math.floor((Date.now()-t0)/1000))},1000);show()}
function show(){const id=qs[i],q=Q[id],a=an[i],lock=mode=='now'&&a!=null,last=i==qs.length-1;
A.innerHTML=`<div class="top"><button class="ib" aria-label="ออกจากข้อสอบ" onclick="quit()">✕ ออก</button><div class="bar"><i style="width:${(i+1)/qs.length*100}%"></i></div><span class="m" id="tm">${mmss(Math.floor((Date.now()-t0)/1000))}</span><button class="ib" aria-label="ดูทุกข้อ" onclick="pal=1;show()">▦</button></div>
<div class="fade"><div class="card"><div class="qn"><span class="tag" style="background:${CL[q[0]]}">${IC[q[0]]} ${S[q[0]]}</span><button class="ib" aria-label="บันทึกข้อนี้" onclick="bk(${id})">${BK.has(id)?'⭐':'☆'}</button></div><div class="m">ข้อ ${i+1} จาก ${qs.length}</div><div class="q">${q[1]}</div></div>`+q[2].map((c,k)=>{let cl=a===k?' on':'';if(lock)cl=k==q[3]?' ok':a===k?' bad':'';return `<button class="opt${cl}" ${lock?'disabled':''} onclick="pick(${k})"><span class="l">${L[k]}</span><span>${c}</span></button>`}).join('')+`</div><div class="dock"><div><button onclick="mv(-1)" ${i?'':'disabled'}>←</button>${last?`<button class="pri" onclick="end()">ส่งและดูผล ✓</button>`:`<button class="pri" onclick="mv(1)">ถัดไป →</button>`}</div></div>`+(pal?`<div class="pal" onclick="pal=0;show()"><div onclick="event.stopPropagation()"><b>ข้อทั้งหมด</b> <span class="m">แตะเพื่อกระโดดไปข้อนั้น</span><div class="nv"><button class="btn" onclick="pal=0;quit()">🔀 เลือกข้อสอบชุดใหม่</button></div><div class="g">${qs.map((x,k)=>{const r=an[k];let c=r==null?'':mode=='now'?(r===Q[x][3]?'ok':'bad'):'d';return `<button class="${c}${k==i?' cur':''}" onclick="i=${k};pal=0;show()">${k+1}</button>`}).join('')}</div></div></div>`:'')}
function quit(){const u=qs.length-an.filter(x=>x!=null).length;ask({title:'ออกจากข้อสอบ?',text:u?`ยังไม่ได้ตอบ ${u} ข้อ ผลที่ทำไปจะไม่ถูกบันทึก`:'',icon:'warning',ok:'ออกเลย',no:'ทำต่อ'}).then(r=>{if(r)home()})}
function bk(id){const had=BK.has(id);had?BK.delete(id):BK.add(id);sv('ktbk',[...BK]);show();tst(had?'เอาข้อนี้ออกจากที่บันทึกแล้ว':'บันทึกข้อนี้แล้ว ⭐',had?'info':'success')}
function pick(k){an[i]=k;if(mode=='now'&&k===Q[qs[i]][3]){M.add(qs[i]);sv('ktm',[...M])}show()}
function mv(d){i+=d;show();scrollTo(0,0)}
function end(){const u=qs.length-an.filter(x=>x!=null).length,f=()=>{stop();tt=Math.floor((Date.now()-t0)/1000);qs.forEach((x,k)=>{if(an[k]===Q[x][3])M.add(x)});sv('ktm',[...M]);flt=0;rev()};if(!u)return f();ask({title:'ยังตอบไม่ครบ',text:`ยังไม่ได้ตอบ ${u} ข้อ ส่งเลยไหม`,icon:'question',ok:'ส่งเลย',no:'กลับไปทำต่อ'}).then(r=>{if(r)f()})}
function rev(){const r=qs.filter((x,k)=>an[k]===Q[x][3]).length,n=qs.length,pc=Math.round(r/n*100),col=pc>=60?'var(--ok)':'var(--no)',msg=pc>=80?'เยี่ยมมาก! 🎉':pc>=60?'ผ่านเกณฑ์แล้ว 👍':'อีกนิดเดียว สู้ต่อ 💪';
A.innerHTML=`<div class="card res fade"><div class="rg" style="background:conic-gradient(${col} ${pc*3.6}deg,var(--b) 0)"><div><span>${pc}%<small>${r}/${n} ข้อ</small></span></div></div><b>${msg}</b><div class="st"><div><b class="ok">${r}</b><span class="m">ถูก</span></div><div><b class="no">${n-r}</b><span class="m">ผิด/ว่าง</span></div><div><b>${mmss(tt)}</b><span class="m">เวลา</span></div></div></div>
<button class="btn pri" onclick="go(qs.slice())">ทำชุดนี้ใหม่ 🔄</button><button class="btn" onclick="go(qs.filter((x,k)=>an[k]!==Q[x][3]))">ทำเฉพาะข้อที่ผิด</button><button class="btn" onclick="home()">🔀 เลือกข้อสอบชุดใหม่</button>
<div class="tabs">${['ทั้งหมด','เฉพาะข้อผิด','⭐ บันทึก'].map((t,k)=>`<button class="${flt==k?'on':''}" onclick="flt=${k};rev()">${t}</button>`).join('')}</div>`+qs.map((x,k)=>{const q=Q[x],ok=an[k]===q[3];if(flt==1&&ok||flt==2&&!BK.has(x))return'';return `<div class="card"><b>${k+1}. ${q[1]}</b> <span class="${ok?'ok':'no'}">${ok?'✓ ถูก':'✗ ผิด'}</span><div class="m" style="margin:2px 0 6px">${S[q[0]]}</div>`+q[2].map((c,j)=>`<div class="rv${j===q[3]?' a':''}${j===an[k]&&!ok?' w':''}">${L[j]}) ${c}${j===q[3]?' ✓':''}${j===an[k]&&!ok?' · ที่คุณเลือก':''}</div>`).join('')+`</div>`}).join('');scrollTo(0,0)}
home();
</script></body></html>
